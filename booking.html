<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco-Tourism Guide App | Contact & Booking</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
  </head>
  <body>
    <header>
      <div class="brand">
        <a href="index.html" style="display: flex; align-items: center; gap: 10px;">
          <img src="images/logo.svg" alt="Eco-Tourism Guide Logo" class="nav-logo">
          <h1>Eco-Tourism | Contact</h1>
        </a>
      </div>

      <nav class="links">
        <div class="nav-controls">
          <button class="toggle-mode" aria-label="Toggle Theme">
            <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <button class="hamburger" id="mobile-menu-btn" aria-label="Toggle Menu">&#9776;</button>
        </div>

        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="destinations.html">Explore</a></li>
          <li><a href="booking.html">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="contact-container">
        <!-- Contact Info Block -->
        <aside class="contact-details">
          <h2>Get in Touch</h2>
          <p>Ready to explore? Drop us a line or book your expedition directly.</p><br>
          <ul class="info-list">
            <li><strong>HQ:</strong> Balakong, Selangor, Malaysia</li>
            <li><strong>Email:</strong> guides@eco-tourism.mock</li>
            <li><strong>Phone:</strong> +60 12-345 6789</li>
          </ul>
        </aside>

        <!-- The Booking Form -->
        <div class="form-wrapper">
          <form id="booking-form" novalidate>
            
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" placeholder="e.g., Jane Doe">
              <span class="error-msg" id="nameError"></span>
            </div>

            <div class="form-group">
              <label for="emailAddr">Email Address</label>
              <input type="email" id="emailAddr" name="emailAddr" placeholder="jane@example.com">
              <span class="error-msg" id="emailError"></span>
            </div>

            <div class="form-group">
              <label for="destination">Select Destination (Dropdown)</label>
              <select id="destination" name="destination">
                <option value="">-- Choose a location --</option>
                <option value="danum">Danum Valley Canopy</option>
                <option value="sipadan">Sipadan Reef Dive</option>
                <option value="kinabalu">Mount Kinabalu Summit</option>
              </select>
              <span class="error-msg" id="destError"></span>
            </div>

            <div class="form-group">
              <label>Experience Level (Radio Buttons)</label>
              <div class="radio-group">
                <input type="radio" id="expBeginner" name="experience" value="beginner">
                <label for="expBeginner">Beginner</label>
                
                <input type="radio" id="expAdvanced" name="experience" value="advanced">
                <label for="expAdvanced">Advanced</label>
              </div>
              <span class="error-msg" id="radioError"></span>
            </div>

            <button type="submit" class="submit-btn">Request Booking</button>
            <div id="successMessage" class="success-msg"></div>
          </form>
        </div>
      </section>
    </main>

    <footer>
      <p>Copyright © 2026 Alif Daniel</p>
    </footer>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
